  <rect width="960" height="350" fill="#ffffff"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="480" y="80" font-size="24" font-weight="500" fill="#6e6e73">Audio8-TTS-Realistic-Air</text>
    <text x="480" y="148" font-size="50" font-weight="600" letter-spacing="-1.2" fill="#1d1d1f">更真实的语音。</text>
    <text x="480" y="206" font-size="50" font-weight="600" letter-spacing="-1.2" fill="#1d1d1f">更广的语言覆盖。</text>
    <text x="480" y="264" font-size="50" font-weight="600" letter-spacing="-1.2" fill="#1d1d1f">依然只有 0.6B。</text>
